prompts:
  scholar-overview:
    name: "Scholar Profile Overview"
    description: "Two-paragraph author-centric overview for a scholar-profile subset"
    content: |
      Analyze the following scholar-profile papers to create a concise author-centric summary. Follow these specific guidelines:

      1. Input Format:
      You will receive:
      - Author profile subject: [Author Name]
      - A current visible subset of papers from the author's profile

      For each paper, you may receive:
      - ID: [Paper ID number]
      - Title: [Paper Title]
      - Year: [Publication Year]
      - Authors: [Author list in original order]
      - Topics: [Paper topics]
      - Contribution roles: [Author contribution roles, when available]
      - Abstract: [Paper Abstract]

      2. Summary Structure and Length:
      - Write EXACTLY two paragraphs:
        * First paragraph: Recurring research areas, topics, and methodological patterns
        * Second paragraph: Contribution-role patterns, types of outputs, venues, and distinguishing strengths
      - Keep the summary CONCISE, INFORMATIVE, and PROFILE-AWARE
      - Treat the papers as the current visible subset of the scholar profile
      - Do not imply that the provided subset represents the author's entire career
      - Present the summary directly and naturally, without sounding defensive or cautionary

      3. Content Requirements:
      - Only use information explicitly stated in the provided metadata and abstracts
      - Use topics as the primary signal for grouping and interpreting the subset
      - Use contribution roles when available to characterize the author's work and recurring modes of contribution
      - Preserve the possibility that the papers may be mixed or only partially related
      - Do not force all papers into one unified narrative or single research thread
      - Treat author order as weak contextual evidence only and do not make strong contribution claims from order alone
      - Maintain academic tone and language
      - Do not use phrases such as "visible research profile", "visible profile", "across this subset", "in this subset", or "selected papers" in the output

      4. Integration and Flow:
      - Group papers by recurring themes, applications, methods, or outputs
      - Emphasize patterns that appear across multiple papers
      - Allow topic diversity to remain visible when the subset is heterogeneous
      - Use precise, economical language
      - Avoid repeating titles or metadata unless needed to support a specific point
      - Make the second paragraph feel meaningfully different from the first by shifting from thematic coverage to contribution patterns and practical research strengths

      5. Citation Rules:
      - Every claim must be supported by citations using the EXACT paper ID numbers provided
      - Use square brackets for citations: if a paper's ID is 31234, cite it as [31234]
      - Multiple citations should maintain original IDs and be listed in ascending order: [31234,45678,52431]
      - Use only the provided papers as sources
      - Integrate citations naturally into the text

      Synthesize the information while maintaining academic integrity and avoiding information not present in the provided metadata and abstracts.

  scholar-narrative:
    name: "Scholar Profile Narrative"
    description: "Focused single-paragraph author-centric narrative for a scholar-profile subset"
    content: |
      Analyze the following scholar-profile papers to create a focused single-paragraph summary. Follow these specific guidelines:

      1. Input Format:
      You will receive:
      - Author profile subject: [Author Name]
      - A current visible subset of papers from the author's profile

      For each paper, you may receive:
      - ID: [Paper ID number]
      - Title: [Paper Title]
      - Year: [Publication Year]
      - Authors: [Author list in original order]
      - Topics: [Paper topics]
      - Contribution roles: [Author contribution roles, when available]
      - Abstract: [Paper Abstract]

      2. Summary Structure:
      - Create ONE focused paragraph that:
        * Begins with the strongest recurring themes or research areas in the subset
        * Connects related works and methods where the metadata and abstracts support it
        * Ends with a concise characterization of the author's broader research orientation suggested by these works
      - Maintain a coherent flow without overstating connections
      - Keep the summary TIGHT, NATURAL, and PROFILE-AWARE
      - Make this version read like a short narrative blurb, not like a compressed two-paragraph overview

      3. Content Requirements:
      - Only use information explicitly stated in the provided metadata and abstracts
      - Stay author-centric rather than topic-search-centric
      - Use topics as the main signal for identifying recurring themes
      - Mention contribution-role patterns only when they are clearly supported and materially useful
      - Do not pretend that all papers form one continuous line of work if the subset is diverse
      - Treat author order as weak contextual evidence only and do not make strong contribution claims from order alone
      - Maintain academic tone and language
      - Do not use phrases such as "visible research profile", "visible profile", "across this subset", "in this subset", or "selected papers" in the output

      4. Length Control Strategies:
      - Write approximately 5-7 substantive sentences
      - Use precise, economical language
      - Avoid redundant phrasing and metadata repetition
      - Prefer broader thematic linkage over title-by-title enumeration
      - Combine related findings or profile signals from multiple papers in single sentences
      - Highlight the most informative thematic and methodological patterns first
      - Use active voice
      - Keep contribution-role discussion brief and secondary unless it is central to the pattern of work

      5. Citation Rules:
      - Every claim must be supported by citations using the EXACT paper ID numbers provided
      - Use square brackets for citations: if a paper's ID is 31234, cite it as [31234]
      - Multiple citations should maintain original IDs and be listed in ascending order: [31234,45678,52431]
      - Use only the provided papers as sources
      - Integrate citations naturally into the text

      Synthesize the information while maintaining academic integrity and avoiding information not present in the provided metadata and abstracts.
  concise:
    name: "Concise Summary"
    description: "Focused narrative-style summary"
    content: |
      Analyze the following research papers' titles and abstracts to create a focused single-paragraph summary. Follow these specific guidelines:

      1. Input Format:
      For each paper, you will receive:
      - ID: [Paper ID number]
      - Title: [Paper Title]
      - Abstract: [Paper Abstract]

      2. Summary Structure:
      - Create ONE focused paragraph that:
        * Begins with a brief context or introduction (1-2 sentences)
        * Presents key methodologies and findings in a logical flow
        * Ends with the most significant conclusions
      - Use clear topic sentences and transitions
      - Maintain a single coherent narrative thread
      - Keep the summary TIGHT and FOCUSED

      3. Content Requirements:
      - Only use information explicitly stated in the provided abstracts
      - Use citations in square brackets with EXACT paper ID numbers
      - Do not say "Paper [ID]", use only the [ID]
      - Present only the most essential findings and connections
      - Highlight critical themes and contradictions
      - Maintain academic tone and language

      4. Length Control Strategies:
      - Write approximately 8-10 substantive sentences
      - Use precise, economical language
      - Avoid redundant information
      - Combine related findings from multiple papers in single sentences
      - Minimize descriptive phrases
      - Use active voice

      5. Citation Rules:
      - Every claim must be supported by citations using the EXACT paper ID numbers provided
      - Use square brackets for citations: if a paper's ID is 31234, cite it as [31234]
      - Multiple citations should maintain original IDs and be listed in ascending order: [31234,45678,52431]
      - Use only the provided papers as sources
      - Integrate citations naturally into the text

      Synthesize the information while maintaining academic integrity and avoiding information not present in the provided abstracts.

  lit_review:
    name: "Literature Review"
    description: ""
    content: |
      Generate a focused academic summary from the following research papers' titles and abstracts. Follow these specific guidelines:

      1. Input Format:
      For each paper, you will receive:
      - ID: [Paper ID number]
      - Title: [Paper Title]
      - Abstract: [Paper Abstract]

      2. Structure and Style:
      - Write 3-4 well-developed paragraphs (400-500 words total)
      - Begin with a paragraph that:
        * Sets the context of the research area
        * Identifies key themes or challenges
        * Establishes the scope of discussion
      - Follow with body paragraphs that:
        * Group related studies and findings thematically
        * Compare and contrast methodologies
        * Highlight research progression and knowledge gaps
      - Conclude with a paragraph that:
        * Synthesizes major findings
        * Identifies trends or patterns
        * Suggests potential research directions

      3. Academic Requirements:
      - Maintain scholarly tone and critical analysis
      - Emphasize relationships between studies
      - Identify theoretical frameworks where present
      - Note methodological strengths and limitations
      - Highlight consensus and contradictions in findings
      - Only use information explicitly stated in the provided abstracts

      4. Integration and Flow:
      - Create smooth transitions between topics and papers
      - Build a coherent narrative that shows how the field has developed
      - Balance description with analysis
      - Group papers by themes rather than discussing them sequentially
      - Synthesize findings rather than merely summarizing each paper

      5. Citation Rules:
      - Every claim must be supported by citations using the EXACT paper ID numbers provided
      - Use square brackets for citations: if a paper's ID is 31234, cite it as [31234]
      - Multiple citations should maintain original IDs and be listed in ascending order: [31234,45678,52431]
      - Integrate citations naturally into the text
      - Avoid excessive citation clustering
      - Do not modify, simplify, or renumber the original paper IDs

      Begin directly with the content, avoiding any headers, labels, or formatting markers. Maintain academic integrity while avoiding information not present in the provided abstracts.
  two_paragraph:
    name: "Two-Paragraph Summary"
    description: "Methodology overview + key findings"
    content: |
      Analyze the following research papers' titles and abstracts to create a concise summary. Follow these specific guidelines:

      1. Input Format:
      For each paper, you will receive:
      - ID: [Paper ID number]
      - Title: [Paper Title]
      - Abstract: [Paper Abstract]

      2. Summary Structure and Length:
      - Write EXACTLY two paragraphs:
        * First paragraph: A focused introduction and methodology overview
        * Second paragraph: Key findings and conclusions
      - Keep the summary BRIEF and CONCISE
      - Prioritize only the most significant findings and connections
      - Eliminate any redundant or secondary information
      - Use short, clear sentences

      3. Content Requirements:
      - Only use information explicitly stated in the provided abstracts
      - Use citations in square brackets with EXACT paper ID numbers
      - Do not say "Paper [ID]", use only the [ID]
      - Focus on essential findings and critical connections between papers
      - Highlight only the most important themes and contradictions
      - Maintain academic tone and language

      4. Citation Rules:
      - Every claim must be supported by citations using the EXACT paper ID numbers provided
      - Use square brackets for citations: if a paper's ID is 31234, cite it as [31234]
      - Multiple citations should maintain original IDs and be listed in ascending order: [31234,45678,52431]
      - Use only the provided papers as sources
      - Integrate citations naturally into the text

      5. Length Control:
      - Keep sentences concise and focused
      - Avoid elaboration on minor points
      - Use precise language instead of lengthy descriptions
      - Eliminate redundant citations when multiple sources support the same point

      Synthesize the information while maintaining academic integrity and avoiding information not present in the provided abstracts.